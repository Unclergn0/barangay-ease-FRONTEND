<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Forgot Password | BarangayEase Admin</title>
    <link rel="stylesheet" href="webAdmincss/brgyAdmin.css">
    <!-- Idinagdag ang FontAwesome para sa eye icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <h1>Muntinlupa City BarangayEase</h1>
            <p>Secure Admin Password Recovery</p>
        </div>

        <form id="forgotForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter registered email" required>
            </div>

            <!-- Security PIN with Show/Hide Toggle & Numbers Only -->
            <div class="input-group">
                <label>Your Personal Security PIN</label>
                <div class="password-wrapper">
                    <input type="password" id="securityPin" placeholder="Enter your security PIN" maxlength="6" required>
                    <i class="fa-solid fa-eye toggle-password" data-target="securityPin"></i>
                </div>
            </div>

            <!-- New Password with Show/Hide Toggle -->
            <div class="input-group">
                <label>New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                    <i class="fa-solid fa-eye toggle-password" data-target="newPassword"></i>
                </div>
            </div>

            <!-- Confirm Password with Show/Hide Toggle -->
            <div class="input-group">
                <label>Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                    <i class="fa-solid fa-eye toggle-password" data-target="confirmPassword"></i>
                </div>
            </div>

            <button type="submit" class="btn">Reset Password Securely</button>
        </form>

        <a href="loginAdmin.html" class="auth-link">Back to Login</a>
    </div>
</div>

<script src="webAdminjs/api-config.js"></script>
<script src="webAdminjs/forgotpassAdmin.js"></script>
</body>
</html>
