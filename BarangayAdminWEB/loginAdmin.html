
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barangay Personnel Login | BarangayEase</title>

    <link rel="stylesheet" href="webAdmincss/brgyAdmin.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- LOGO / HEADER -->
            <div class="auth-logo">
                <h1>Muntinlupa City BarangayEase</h1>
                <p>Barangay Personnel Portal</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Work Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your work email"
                        autocomplete="username"
                        required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <i
                            class="fa-solid fa-eye toggle-password"
                            data-target="password"
                            role="button"
                            tabindex="0"
                            aria-label="Show password">
                        </i>

                    </div>
                </div>

                <!-- LOGIN BUTTON -->
                <button type="submit" class="btn" id="loginBtn">

                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login

                </button>

            </form>

            <!-- ACCOUNT LINKS -->
            <div class="account-links">

                <a href="forgotpassAdmin.html" class="auth-link">
                    Forgot your password?
                </a>

                <a href="registerAdmin.html" class="auth-link">
                    Don't have an account? Register here
                </a>

            </div>

            <!-- PORTAL NAVIGATION -->
            <div class="portal-links">

                <!-- LEFT: RESIDENT PORTAL -->
                <a
                    href="../ResidentWEB/login.html"
                    class="portal-link">

                    <i class="fas fa-user"></i>

                    <span>Switch to Resident Portal</span>

                </a>

                <!-- RIGHT: ANALYTICS DASHBOARD -->
                <a
                    href="AnalyticsLogin.html"
                    class="portal-link">

                    <i class="fas fa-chart-line"></i>

                    <span>Analytics Report Dashboard</span>

                </a>

            </div>

        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="webAdminjs/api-config.js"></script>
    <script src="webAdminjs/loginAdmin.js"></script>

</body>
</html>
